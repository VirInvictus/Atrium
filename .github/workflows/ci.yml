name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Atrium requires gtk4 >= 4.16; Ubuntu runners ship 4.14, so the build
    # aborts in gdk4-sys. Fedora carries a new-enough GTK and matches the
    # project's actual target environment.
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            sqlite-devel \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@v5

      - name: VERSION sync guard
        # VERSION is the single source of truth (meson reads the file
        # directly), and an empty one fails silently: meson reads an
        # empty file as an empty version string, which is exactly how
        # the v0.74.0 stamp shipped (the stamp commit deleted the line
        # and wrote nothing). Fail when the file is empty or has
        # drifted from the workspace Cargo.toml version. Mirrors the
        # regression.sh step 0 and the atrium-cli version-sync test.
        run: |
          CARGO_VERSION="$(grep -m1 '^version =' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          FILE_VERSION="$(cat VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION is empty; it is the single source of truth and meson reads it directly" >&2
            exit 1
          fi
          if [ "$FILE_VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != workspace Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: cargo-sources.json freshness guard
        # The Flatpak offline build vendors crates from the generated
        # manifest; a lock change without the regen leaves it pinning
        # stale commits (bit at v0.70.0 and again at v0.72.1). Fail CI
        # whenever the checked-in file disagrees with Cargo.lock.
        # Container jobs run as root against a host-owned checkout, so
        # git's dubious-ownership check rejects the repo and `git diff`
        # silently degrades to --no-index (exit 129, first seen on run
        # 34769246376); mark the workspace safe before touching git.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run scripts/flatpak-cargo-generator.py Cargo.lock -o data/cargo-sources.json
          git diff --exit-code data/cargo-sources.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # The GTK binary crate's tests call gtk::init(), which needs a display.
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a cargo test --workspace
