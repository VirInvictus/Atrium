name: Release

# A v* tag is always hand-cut (forward-only policy, verbatim patchnotes
# message); this workflow answers it with the same checks CI runs on
# main, then creates the GitHub Release from the tag's own verbatim
# message. Decided by Brandon 2026-09-14 (tag CI + auto-Release).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-release:
    name: fmt + clippy + test, then Release from tag
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            gh \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            sqlite-devel \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: VERSION sync guard
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CARGO_VERSION="$(grep -m1 '^version =' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          FILE_VERSION="$(cat VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION is empty; it is the single source of truth and meson reads it directly" >&2
            exit 1
          fi
          if [ "$FILE_VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != workspace Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi
          if [ "v$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag ($GITHUB_REF_NAME) != VERSION ($FILE_VERSION)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a cargo test --workspace

      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        # checkout rewrites refs/tags/vX to the resolved commit SHA even
        # after its fetch (deadbeef-cui v2.0.1 precedent), so the annotated
        # object must be re-fetched --force right before it is read; gh's
        # --notes-from-tag otherwise silently falls back to the commit
        # message (Catagotchi issue #2, ten damaged releases over six
        # weeks; Atrium's v0.76.0 body was the same casualty, repaired
        # 2026-11-17).
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Create the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          OT="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          if [ "$OT" != "tag" ]; then
            echo "::error::tag $TAG is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable"
            exit 1
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/release-notes.md
          TITLE="$(head -1 /tmp/release-notes.md)"
          gh release create "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            --title "$TITLE"
